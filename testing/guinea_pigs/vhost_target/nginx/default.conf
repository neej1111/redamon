# Three virtual hosts on one address, which is what makes vhost/SNI enumeration
# worth running: only the Host header (L7) or the SNI name (L4) decides which one
# answers, and none of the hidden ones has to exist in DNS.

# What a raw request to the IP gets: the baseline every candidate is compared to.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    default_type text/plain;
    location / {
        return 404 "no site configured for this host\n";
    }
}

# The hidden panel. In scope (a child of the lab apex) and deliberately never in
# DNS, so it only ever appears through a Host header or an SNI name. Its reply
# differs from the baseline in both status and length, which is the anomaly the
# module looks for.
server {
    listen 80;
    listen 443 ssl;
    server_name admin.vhostlab.test;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    default_type text/html;
    location / {
        return 200 "<html><head><title>Internal Admin Console</title></head><body><h1>Internal Admin Console</h1><p>Restricted. Staff access only. This host is not published in DNS and is reachable only by addressing it directly.</p><ul><li>User administration</li><li>Job scheduler</li><li>Build pipelines</li></ul></body></html>\n";
    }
}

# A second hidden panel, so a test needing a pre-existing node does not have to
# borrow the one that proves a freshly created node is flagged unconfirmed.
server {
    listen 80;
    listen 443 ssl;
    server_name jenkins.vhostlab.test;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    default_type text/html;
    location / {
        return 200 "<html><head><title>Jenkins</title></head><body><h1>Build Server</h1><p>Continuous integration for internal projects. Not published in DNS.</p><p>Pipelines, agents and credentials live here.</p></body></html>\n";
    }
}

# A co-hosted third party: same address, a name under somebody else's domain.
# The graph must not file this under our inventory.
server {
    listen 80;
    listen 443 ssl;
    server_name partner.cohost.test;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    default_type text/html;
    location / {
        return 200 "<html><head><title>Partner Portal</title></head><body><h1>Partner Portal</h1><p>Operated by a different organisation that happens to share this frontend address.</p></body></html>\n";
    }
}
